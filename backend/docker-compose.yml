version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: aegis_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - NEO4J_DATABASE=neo4j
      - GRAPH_STORE_TYPE=neo4j
      - JWT_SECRET=aegis-production-secret-token-replace-in-env-2026
      - FRONTEND_URL=http://localhost:5173
      - MAX_EMAIL_SIZE_MB=10
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/backend/storage
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  email_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_email_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=aegis-production-secret-token-replace-in-env-2026
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/backend/storage
    volumes:
      - evidence_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m backend.app.workers.email_worker

  investigation_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_investigation_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - NEO4J_DATABASE=neo4j
      - GRAPH_STORE_TYPE=neo4j
      - JWT_SECRET=aegis-production-secret-token-replace-in-env-2026
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/backend/storage
    volumes:
      - evidence_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m backend.app.workers.investigation_worker

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  evidence_storage:
